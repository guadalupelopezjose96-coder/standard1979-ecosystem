apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-ai-security-gateway
  namespace: aura-opco
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aura-ai-security-gateway
  template:
    metadata:
      labels:
        app: aura-ai-security-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/standard1979/aura-ai-security-gateway:2.4.0
          ports:
            - containerPort: 8002
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aura-ai-security-gateway-hpa
  namespace: aura-opco
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aura-ai-security-gateway
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
