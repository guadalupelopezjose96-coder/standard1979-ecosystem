apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: standard1979-six-domains-ingress
  namespace: aura-opco
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "100"
spec:
  tls:
    - hosts:
        - standard1979.com
        - auraintelcore.com
        - auratetrax.com
        - auraintelstudios3d.com
        - fourphonix.com
        - prophonix.com
      secretName: s1979-ecosystem-tls13-cert
  rules:
    - host: standard1979.com
      http:
        paths:
          - path: /v1/webhooks
            pathType: Prefix
            backend:
              service:
                name: s1979-finance-tax-engine
                port:
                  number: 8003
    - host: auraintelcore.com
      http:
        paths:
          - path: /v1/secure-inference
            pathType: Prefix
            backend:
              service:
                name: aura-ai-security-gateway
                port:
                  number: 8002
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: aura-oidc-sso
                port:
                  number: 8001
    - host: auratetrax.com
      http:
        paths:
          - path: /v1/secure-inference
            pathType: Prefix
            backend:
              service:
                name: aura-ai-security-gateway
                port:
                  number: 8002
    - host: auraintelstudios3d.com
      http:
        paths:
          - path: /v1/secure-inference
            pathType: Prefix
            backend:
              service:
                name: aura-ai-security-gateway
                port:
                  number: 8002
    - host: fourphonix.com
      http:
        paths:
          - path: /v1/tax/telecom-afc-quote
            pathType: Prefix
            backend:
              service:
                name: s1979-finance-tax-engine
                port:
                  number: 8003
    - host: prophonix.com
      http:
        paths:
          - path: /v1/billing/meter-event
            pathType: Prefix
            backend:
              service:
                name: s1979-finance-tax-engine
                port:
                  number: 8003
