receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  # Eliminación estricta de atributos sensibles (GDPR Art. 25, CCPA y FCC CPNI)
  attributes/scrub_pii:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: db.statement
        action: hash
      - key: client.ip
        action: hash
      - key: sip.caller_e164
        action: hash
      - key: credit_card_pan
        action: delete

  # Redacción por expresiones regulares en cuerpos de logs y trazas
  transform/redact_secrets:
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b", "[REDACTED_EMAIL]")
          - replace_pattern(body, "\\b(?:\\d[ -]*?){13,16}\\b", "[REDACTED_PAN]")
          - replace_pattern(body, "\\b\\d{3}-\\d{2}-\\d{4}\\b", "[REDACTED_SSN]")

exporters:
  awss3/worm_audit:
    s3uploader:
      region: us-east-1
      s3_bucket: s1979-worm-audit-standard1979-com
      s3_prefix: otel-telemetry
      compression: gzip

  otlp/grafana_cloud:
    endpoint: tempo-us-east-1.auraintelcore.com:4317

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/scrub_pii, batch]
      exporters: [otlp/grafana_cloud]
    logs:
      receivers: [otlp]
      processors: [attributes/scrub_pii, transform/redact_secrets, batch]
      exporters: [awss3/worm_audit]
